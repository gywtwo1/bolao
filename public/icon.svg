<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#10b981" stroke-width="8"/>
  
  <!-- Soccer Ball Center -->
  <g transform="translate(256, 210)">
    <circle r="120" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>
    <!-- Ball Patterns -->
    <polygon points="0,-45 42,-15 26,38 -26,38 -42,-15" fill="#0f172a"/>
    <line x1="0" y1="-45" x2="0" y2="-120" stroke="#0f172a" stroke-width="8"/>
    <line x1="42" y1="-15" x2="114" y2="-38" stroke="#0f172a" stroke-width="8"/>
    <line x1="26" y1="38" x2="72" y2="96" stroke="#0f172a" stroke-width="8"/>
    <line x1="-26" y1="38" x2="-72" y2="96" stroke="#0f172a" stroke-width="8"/>
    <line x1="-42" y1="-15" x2="-114" y2="-38" stroke="#0f172a" stroke-width="8"/>
  </g>
  
  <!-- Trophy / Stars Accent -->
  <circle cx="120" cy="110" r="16" fill="url(#gold)"/>
  <circle cx="392" cy="110" r="16" fill="url(#gold)"/>
  <circle cx="256" cy="65" r="22" fill="url(#gold)"/>
  
  <!-- Title Badge -->
  <g transform="translate(256, 400)">
    <rect x="-190" y="-36" width="380" height="72" rx="36" fill="#020617" stroke="url(#gold)" stroke-width="6"/>
    <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#fbbf24" letter-spacing="2">
      BOLÃO 2026
    </text>
  </g>
